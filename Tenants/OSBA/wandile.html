  OSBA email signature, version 2 (23 Oct 2026).

  WRITTEN BY tools/make.py: don't edit this file by hand. Change make.py and run
      py -3 tools/make.py
  then paste the result where it is used again (see README.md). Hand edits are lost on the next run.

  WHY IT LOOKS LIKE THIS
  - One flat table, no tables inside tables: classic Outlook on Windows pastes signatures through Word,
    which breaks nested layout tables.
  - No padding: Word ignores it. Spaces are empty rows of an exact height, or "gap" paragraphs
    (font-size 0 with an exact line-height; mso-line-height-rule:exactly makes Word keep it).
  - Every size is written twice, as an attribute (width="", height="") and in the style, for old programs.
  - 600 x 330 px, the same as the artwork in points, so every position comes straight from the design.
    Columns: 254 logo | 146 name | 14 divider | 19 icon | 167 contact = 600.
  - The pictures are served from https://osbusinessamp.com/email-signature/v2/ . Don't rename or move them:
    sent emails point there. Replacing a picture under the same name updates every signature.
  - Font: Avenir Next (Macs and iPhones have it); Windows shows Segoe UI instead. Text colour #212d34,
    background #f3f3f3.

  3 Nov 2026 (edited by hand, on the Mac; make.py is on the Windows PC and needs the same two changes):
  - Gaps are font-size:0 (was 1px). Apple Mail shows no text under 9px while an email is written and makes a
    fixed line-height grow with it, so 1px gaps came out 9 times taller and the signature looked stretched.
  - Social links as in OSB One (Settings > Company details); no YouTube icon (no YouTube address yet).

  THIS FILE: filled in for one person (PEOPLE in make.py). Open it in a browser, select all, copy, and paste
  it into the signature settings of Outlook or Apple Mail.
-->
